<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MES · THE GAUSS VINA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--ink:#14202B;--sub:#5B6875;--line:#DDE3E9;--bg:#F3F5F7;--card:#fff;--brand:#0F5C8C;--ok:#15803D;--warn:#B45309;--bad:#B91C1C;--run:#16A34A;--stop:#DC2626;--setup:#D97706;--idle:#64748B}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#0B2A3F;color:#fff;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.top b{font-size:17px;letter-spacing:.2px}
.top .sp{flex:1}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{color:#CFE0EC;text-decoration:none;padding:7px 12px;border-radius:8px;font-size:14px}
.nav a.on{background:#fff;color:#0B2A3F;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);font-size:13.5px}
.dot{width:9px;height:9px;border-radius:50%;background:#22C55E;display:inline-block}
.dot.off{background:#F87171}
main{padding:16px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.grid{display:grid;gap:12px}
h2{font-size:18px;margin:0 0 10px}
.vi{display:block;font-size:11px;color:var(--sub);font-weight:400}
.btn{padding:12px 18px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:15px}
.btn.big{padding:18px 22px;font-size:19px;border-radius:12px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn:disabled{opacity:.45}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pick button{padding:14px 10px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:15px;font-weight:600;text-align:center;min-height:64px}
.pick button.on{border-color:var(--brand);background:#E7F1F8;color:var(--brand)}
.wo{border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;text-align:left;width:100%}
.wo.on{border-color:var(--brand);box-shadow:0 0 0 3px #CFE3F1}
.wo .no{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:var(--sub)}
.wo .nm{font-weight:700;font-size:16px;margin:2px 0}
.bar{height:8px;border-radius:4px;background:#E6EBF0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--sub);font-weight:600;background:#F8FAFB}
td.r,th.r{text-align:right}
.muted{color:var(--sub);font-size:12.5px}
.ov{position:fixed;inset:0;background:rgba(10,20,30,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.ov .box{background:#fff;border-radius:14px;padding:18px 20px;width:min(720px,100%);max-height:94vh;overflow:auto}
.num{font-size:34px;font-weight:700;text-align:right;padding:10px 14px;border:2px solid var(--line);border-radius:10px;width:100%}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.pad button{padding:16px;font-size:22px;font-weight:700;border-radius:10px;border:1px solid var(--line);background:#F8FAFB}
.field{display:block;margin-bottom:10px}
.field>span{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
.m-run{background:#DCFCE7;color:#166534}.m-stop{background:#FEE2E2;color:#991B1B}.m-setup{background:#FEF3C7;color:#92400E}.m-idle{background:#E2E8F0;color:#334155}
.mtile{border-radius:12px;padding:14px;color:#fff;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;border:none;text-align:left;width:100%}
.s-run{background:var(--run)}.s-stop{background:var(--stop)}.s-setup{background:var(--setup)}.s-idle{background:var(--idle)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0B2A3F;color:#fff;padding:12px 20px;border-radius:10px;z-index:60;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
/* TV */
body.tv{background:#0A1621;color:#E7EEF4}
body.tv .top{background:#06101A}
body.tv .card{background:#0F2131;border-color:#1E3446}
body.tv th{background:#0F2131;color:#8FA6B8;border-color:#1E3446}
body.tv td{border-color:#1E3446}
body.tv .muted{color:#8FA6B8}
body.tv .bar{background:#1E3446}
body.tv .bar i{background:#38BDF8}
.kpi{font-size:44px;font-weight:800;line-height:1.05}
.kpi small{font-size:15px;font-weight:500;color:#8FA6B8;display:block;margin-bottom:4px}
@media (max-width:700px){main{padding:10px}.btn.big{padding:14px 16px;font-size:17px}.kpi{font-size:32px}}
</style>
</head>
<body>
<div class="top" id="top">
  <b>🏭 MES</b><span class="muted" style="color:#9FB7C8">THE GAUSS VINA</span>
  <nav class="nav" id="nav"></nav>
  <span class="sp"></span>
  <span class="chip" id="net"><span class="dot"></span><span id="net-t">연결됨</span></span>
  <span class="chip" id="clock"></span>
  <span class="chip" id="pwc" style="cursor:pointer;display:none" onclick="pwChange(false)" title="비밀번호 변경 / Đổi mật khẩu">🔑</span>
  <span class="chip" id="who" style="cursor:pointer" onclick="logout()"></span>
</div>
<main id="app"><div class="card">⏳ 불러오는 중… / Đang tải…</div></main>

<script>
// ════════════════════════════════════════════════════════════
//  MES · THE GAUSS VINA (2026-11-06)
//  데이터는 ERP(구글 시트)와 따로 Supabase(PostgreSQL)에 저장한다.
//  ERP에서는 작업지시만 받아오고, 실적은 나중에 ERP로 넘긴다.
// ════════════════════════════════════════════════════════════
const ERP_API = 'https://script.google.com/macros/s/AKfycbyo_eOJACEPPqV-CHA9rUnYK1ncJbr3EXmFrKPYgNlncHtwI5N5sChHs-wOUmVV-Jgiwg/exec';
// Supabase 프로젝트 주소·공개키(anon). 공개용이라 화면 코드에 있어도 되고, 실제 보호는 DB 권한(RLS)이 한다.
const SB_URL_DEFAULT = 'https://dorbfjtgnjnsnyamgnxy.supabase.co', SB_KEY_DEFAULT = 'sb_publishable_3f-9RqobsZ2Na6tUI8ruNg_eshe2vF2';
const LS = { get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} } };
const SB_URL = LS.get('mes_sb_url', SB_URL_DEFAULT), SB_KEY = LS.get('mes_sb_key', SB_KEY_DEFAULT);
let sb = null, ME = {email: '', role: ''}, M = {proc: [], mach: [], work: [], reasons: [], wo: [], rec: [], ev: [], route: [], gauge: [], chkItem: [], chk: [], skill: [], c4: []};
const S = {view: '', worker: LS.get('mes_worker',''), proc: LS.get('mes_proc',''), device: LS.get('mes_device','') || ('태블릿-' + Math.random().toString(36).slice(2,6).toUpperCase()), wo: ''};
LS.set('mes_device', S.device);
const $ = id => document.getElementById(id);
const E = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const N = v => (Math.round((+v||0)*1000)/1000).toLocaleString();
const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };   // 기기 시간대(베트남) 기준 오늘 0시
const hm = t => { const d = new Date(t); return isNaN(d) ? '' : d.toTimeString().slice(0,5); };
const ymd = t => { const d = new Date(t); if (isNaN(d)) return ''; const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const dur = ms => { ms = Math.max(0, ms|0); const h = Math.floor(ms/3600e3), m = Math.floor(ms%3600e3/60e3); return h ? `${h}시간 ${m}분` : `${m}분`; };
function toast(t, ms){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms || 2600); }

// ── 끊김 대비: 저장 실패하면 기기에 쌓아 두고 연결되면 다시 보낸다
const Q = { load(){ try { return JSON.parse(LS.get('mes_q','[]')); } catch(e){ return []; } }, save(q){ LS.set('mes_q', JSON.stringify(q)); } };
async function dbWrite(op){
  // op = {t:'insert'|'update', table, row, match}
  try {
    let r;
    if (op.t === 'insert') r = await sb.from(op.table).insert(op.row).select().single();
    else r = await sb.from(op.table).update(op.row).match(op.match).select();
    if (r.error) throw r.error;
    return r.data;
  } catch (e) {
    const msg = String(e && (e.message || e)), net = /fetch|network|Failed|timeout|offline/i.test(msg) || !navigator.onLine;
    if (net) { const q = Q.load(); q.push({...op, at: Date.now()}); Q.save(q); setNet(false); toast('📶 연결이 끊겨 기기에 저장했습니다. 연결되면 자동으로 보냅니다.'); return {queued: true}; }
    alert('저장 실패: ' + msg); return null;
  }
}
async function flushQ(){
  const q = Q.load(); if (!q.length || !sb) return;
  const left = [];
  for (const op of q) { try { const r = op.t === 'insert' ? await sb.from(op.table).insert(op.row) : await sb.from(op.table).update(op.row).match(op.match); if (r.error) throw r.error; } catch(e) { left.push(op); } }
  Q.save(left); setNet(!left.length);
  if (q.length !== left.length) { toast(`📤 밀린 기록 ${q.length - left.length}건을 보냈습니다.`); await loadLive(); render(); }
}
function setNet(ok){ const q = Q.load().length; $('net').querySelector('.dot').className = 'dot' + (ok && navigator.onLine ? '' : ' off'); $('net-t').textContent = (ok && navigator.onLine ? '연결됨' : '오프라인') + (q ? ` · 대기 ${q}` : ''); }
window.addEventListener('online', () => { setNet(true); flushQ(); }); window.addEventListener('offline', () => setNet(false));
setInterval(flushQ, 15000);
setInterval(() => { $('clock').textContent = new Date().toLocaleString('ko-KR', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit'}); }, 1000);

// ── ERP 작업지시 받아오기 (JSONP, 읽기 전용)
function erpCall(action, data, token){
  return new Promise(res => { const cb = 'mescb_' + Date.now() + Math.random().toString(36).slice(2,6); const s = document.createElement('script');
    const t = setTimeout(() => { delete window[cb]; s.remove(); res({ok:false, error:'timeout'}); }, 20000);
    window[cb] = d => { clearTimeout(t); delete window[cb]; s.remove(); res(d); };
    s.src = ERP_API + '?' + new URLSearchParams({action, data: JSON.stringify(data || {}), callback: cb, ...(token ? {token, user: ME.name || ''} : {})}); s.onerror = () => { clearTimeout(t); res({ok:false, error:'network'}); }; document.body.appendChild(s); });
}
// MES 적용 범위: 200kW PCDU 제품만 (다른 제품은 ERP 실적 입력을 그대로 씀)
const inScope = (code, name) => /PCDU/i.test(String(code || '') + ' ' + String(name || ''));
async function syncWO(silent){
  const r = await erpCall('getWorkOrders', {});
  if (!r || !r.ok) { if (!silent) alert('ERP 작업지시를 받지 못했습니다: ' + (r && r.error)); return; }
  const rows = (r.data || []).filter(w => inScope(w.code, w.name)).filter(w => w.status === '대기' || w.status === '진행중' || (w.status === '완료' && Date.now() - (+w.id||0) < 90*864e5))
    .map(w => ({wo_id: String(w.id), order_no: w.orderNo, code: w.code, name: w.name, cat: w.cat, unit: w.unit || 'Ea', plan_qty: +w.planQty || 0, lot: w.lot || '', status: w.status || '대기', due_date: w.dueDate ? String(w.dueDate).slice(0,10) : null, synced_at: new Date().toISOString()}));
  if (rows.length) { const u = await sb.from('work_orders').upsert(rows, {onConflict: 'wo_id'});
    if (u.error) { if (!silent) alert('작업지시 저장 실패: ' + u.error.message); return; } }
  // ERP에서 지운 작업지시는 MES에서도 "삭제됨"으로 바꿔 현장 목록에서 뺀다 (실적 기록은 그대로 남김)
  const erpIds = new Set((r.data || []).filter(w => inScope(w.code, w.name)).map(w => String(w.id)));
  const gone = M.wo.filter(w => !erpIds.has(w.wo_id) && w.status !== '삭제됨').map(w => w.wo_id);
  if (gone.length) await sb.from('work_orders').update({status: '삭제됨', synced_at: new Date().toISOString()}).in('wo_id', gone);
  if (!silent) toast(`🔄 ERP 작업지시 ${rows.length}건을 받았습니다.` + (gone.length ? ` (ERP에서 삭제된 ${gone.length}건 정리)` : ''));
  await loadMaster();
}

// ERP에서 새로 발행한 작업지시를 자동으로 받아온다: 화면이 열려 있는 동안 2분마다, 태블릿 화면을 다시 켤 때마다
let _woSyncAt = 0, _woSyncOn = false;
function woAutoSync(){
  if (_woSyncOn) return; _woSyncOn = true;
  const tick = async (force) => {
    if (document.hidden || (!force && Date.now() - _woSyncAt < 100e3)) return;
    _woSyncAt = Date.now();
    const before = M.wo.map(w => w.wo_id + w.status).join();
    await syncWO(true);
    const after = M.wo.map(w => w.wo_id + w.status).join();
    const busy = document.querySelector('.ov') || (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName));
    if (before !== after && !busy) { render(); const n = activeWO().length; toast(`🆕 작업지시 목록이 바뀌었습니다 (진행 ${n}건)`); }
  };
  setInterval(() => tick(false), 120e3);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(false); });
}
// ── 데이터 읽기
async function loadMaster(){
  const [p, m, w, r, o, rt, g, ci, sk, c4] = await Promise.all([sb.from('processes').select('*').order('seq'), sb.from('machines').select('*').order('code'), sb.from('workers').select('*').order('name'), sb.from('stop_reasons').select('*').order('seq'), sb.from('work_orders').select('*').order('order_no', {ascending: false}), sb.from('routings').select('*').order('seq'), sb.from('gauges').select('*').order('code'), sb.from('check_items').select('*').order('seq'), sb.from('worker_skills').select('*'), sb.from('changes_4m').select('*').order('created_at', {ascending: false}).limit(500)]);
  M.proc = p.data || []; M.mach = m.data || []; M.work = w.data || []; M.reasons = r.data || []; M.wo = o.data || []; M.route = rt.data || [];
  M.gauge = g.data || []; M.chkItem = ci.data || []; M.skill = sk.data || []; M.c4 = c4.data || [];
}
async function loadLive(fromIso){
  const since = fromIso || new Date(today0().getTime() - 0).toISOString();
  const [a, b, c] = await Promise.all([sb.from('prod_records').select('*').gte('created_at', since).neq('status','void').order('created_at', {ascending: false}).limit(2000),
    sb.from('prod_records').select('*').eq('status','running').limit(200),
    sb.from('machine_events').select('*').or(`ended_at.is.null,started_at.gte.${since}`).order('started_at', {ascending: false}).limit(2000)]);
  const map = {}; [...(a.data||[]), ...(b.data||[])].forEach(x => map[x.id] = x); M.rec = Object.values(map).sort((x,y) => String(y.created_at).localeCompare(String(x.created_at)));
  M.ev = c.data || [];
  const ck = await sb.from('machine_checks').select('*').eq('check_date', ymd(new Date())).order('created_at', {ascending: false}).limit(500); M.chk = ck.data || [];
  try { const q = await sb.from('ncr').select('id,status,qty').in('status', ['open','decided','approved']); M.ncrOpen = q.error ? [] : (q.data || []); } catch (e) { M.ncrOpen = []; }
}
const procName = c => (M.proc.find(p => p.code === c) || {}).name || c || '-';
const workName = c => (M.work.find(p => p.code === c) || {}).name || c || '-';
const machName = c => (M.mach.find(p => p.code === c) || {}).name || c || '-';
const woOf = id => M.wo.find(w => w.wo_id === String(id)) || null;
// 품목별 공정 순서(라우팅). 등록 안 된 품목은 전체 공정을 쓴다
function routeOf(w){ if (!w) return []; const r = M.route.filter(x => x.item_code === w.code && String(x.cat||'TP').toUpperCase() === String(w.cat||'TP').toUpperCase()).sort((a,b) => a.seq - b.seq);
  return r.length ? r.map(x => ({...(M.proc.find(p => p.code === x.process_code) || {code: x.process_code, name: x.process_code}), seq: x.seq, is_final: x.is_final, note: x.note, lot_required: !!x.lot_required, unit_name: x.unit_name || '', unit_per: +x.unit_per > 1 ? +x.unit_per : 1, _r: true})) : M.proc.filter(p => p.active !== false && p.in_default !== false); }   // 공정 순서가 없는 품목은 '기본 공정'만
// 고른 공정에 해당하는 작업지시가 없을 때: 다른 작업지시를 보여 주고, 누르면 그 품목의 첫 공정으로 바꾼다
// ✅ [2026-11-11] 지금 공정의 작업지시가 있어도 다른 품목(예: 반제품 공정 선택 중일 때 완제품 지시서)을 아래에 함께 보여 준다
function woOther(hasMine){
  const oth = activeWO().filter(w => !routeOf(w).some(p => p.code === S.proc));
  if (!oth.length) return hasMine ? '' : `<p class="muted">진행할 작업지시가 없습니다. 관리자가 🛠 기준정보에서 "ERP 작업지시 받기"를 누르세요.</p>`;
  return (hasMine ? `<p class="muted" style="grid-column:1/-1;margin:10px 0 4px;padding-top:8px;border-top:1px dashed var(--line,#dde)">다른 공정 작업지시 <span class="vi">Lệnh của công đoạn khác</span> — 누르면 그 품목의 첫 공정으로 바뀝니다.</p>`
    : `<p class="muted" style="grid-column:1/-1;margin:0 0 4px">${E(procName(S.proc))} 공정이 있는 작업지시가 없습니다. 아래 작업지시를 누르면 그 품목의 공정으로 바꿉니다.</p>`) + oth.map(w => { const r = routeOf(w), first = r[0];
    return `<button class="wo" style="opacity:.85" onclick="S.proc='${E(first ? first.code : S.proc)}';LS.set('mes_proc',S.proc);S.wo='${E(w.wo_id)}';render()"><div class="no">${E(w.order_no)} · ${E(w.lot||'')}</div><div class="nm">${E(w.name)}</div>
      <div class="muted">공정 ${E(r.map(p => p.name || procName(p.code)).join(' → ') || '-')}</div></button>`; }).join('');
}
function isFinalFor(w, proc){ const r = routeOf(w).find(p => p.code === proc); return !!(r && r.is_final); }
const activeWO = () => M.wo.filter(w => w.status !== '완료' && w.status !== '취소' && w.status !== '삭제됨' && inScope(w.code, w.name));
function machState(code){ const e = M.ev.filter(x => x.machine_code === code).sort((a,b) => String(b.started_at).localeCompare(String(a.started_at)))[0]; return e && !e.ended_at ? e : (e ? {...e, state: 'idle', reason_code: null, started_at: e.ended_at} : null); }

// ── 로그인
function cfgView(){
  return `<div class="card" style="max-width:560px;margin:30px auto"><h2>⚙️ MES 서버 연결</h2>
    <p class="muted">Supabase 프로젝트의 <b>Project URL</b>과 <b>anon public key</b>를 넣으세요 (Settings → API). <b>service_role key나 DB 비밀번호는 넣지 마세요.</b></p>
    <label class="field"><span>Project URL</span><input id="c-url" value="${E(SB_URL)}" placeholder="https://xxxx.supabase.co"></label>
    <label class="field"><span>anon public key</span><input id="c-key" value="${E(SB_KEY)}" placeholder="sb_publishable_… 또는 eyJhbGciOi…"></label>
    <button class="btn pri" onclick="saveCfg()">저장하고 연결</button></div>`;
}
function saveCfg(){ const u = $('c-url').value.trim(), k = $('c-key').value.trim(); if (!/^https:\/\/.+/.test(u) || k.length < 20) { alert('URL과 키를 확인해주세요.'); return; } let bad = /^sb_secret_/.test(k); try { bad = bad || /service_role/.test(atob((k.split('.')[1]||'').replace(/-/g,'+').replace(/_/g,'/'))); } catch(e) {} if (bad) { alert('비밀(secret/service_role) 키입니다. 공개용 anon(또는 sb_publishable_) 키를 넣어주세요.'); return; } LS.set('mes_sb_url', u); LS.set('mes_sb_key', k); location.reload(); }
function loginView(){
  return `<div class="card" style="max-width:420px;margin:40px auto"><h2>🔐 MES 로그인 <span class="vi">Đăng nhập</span></h2>
    <p class="muted">이 기기에서 한 번만 로그인하면 계속 유지됩니다.</p>
    <label class="field"><span>이메일 / Email</span><input id="l-em" type="email" autocomplete="username"></label>
    <label class="field"><span>비밀번호 / Mật khẩu</span><input id="l-pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></label>
    <button class="btn pri big" style="width:100%" onclick="doLogin()">로그인</button>
    <div id="l-err" style="color:var(--bad);margin-top:8px"></div>
    <p class="muted" style="margin-top:12px">비밀번호를 잊었으면 관리자(법인장)에게 초기화를 요청하세요.<br><span class="vi">Quên mật khẩu? Hãy nhờ quản trị viên đặt lại.</span></p>
    <p class="muted" style="margin-top:14px"><a href="#" onclick="event.preventDefault();LS.del('mes_sb_url');LS.del('mes_sb_key');location.reload()">서버 연결 다시 설정</a></p></div>`;
}
async function doLogin(){
  const r = await sb.auth.signInWithPassword({email: $('l-em').value.trim(), password: $('l-pw').value});
  if (r.error) { $('l-err').textContent = '로그인 실패: ' + r.error.message; return; }
  $('l-pw').value = ''; boot();
}
// ── 🔑 비밀번호 변경 (본인) · 관리자 초기화 후에는 첫 로그인 때 반드시 변경
function pwChange(forced){
  if (ME.role === 'floor') { alert('현장 공용 계정은 태블릿에서 비밀번호를 바꿀 수 없습니다. 관리자에게 요청하세요.'); return; }
  if (ME.role === 'system') { alert('백업 전용 계정은 여기서 바꾸지 마세요. 바꾸면 Apps Script 속성 MES_BK_PW도 같이 바꿔야 자동 백업이 계속됩니다.'); return; }
  const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'pw'; document.body.appendChild(ov);
  ov.innerHTML = `<div class="box" style="max-width:420px"><h2>🔑 비밀번호 변경 <span class="vi">Đổi mật khẩu</span></h2>
    ${forced ? '<p style="color:var(--bad)">관리자가 비밀번호를 초기화했습니다. 계속하려면 새 비밀번호로 바꾸세요.<br><span class="vi">Mật khẩu đã được đặt lại. Hãy đổi mật khẩu mới.</span></p>' : ''}
    <p class="muted">${E(ME.email)}</p>
    <label class="field"><span>${forced ? '임시 비밀번호' : '현재 비밀번호'} / Mật khẩu hiện tại</span><input id="pw-cur" type="password" autocomplete="current-password"></label>
    <label class="field"><span>새 비밀번호 (8자 이상) / Mật khẩu mới</span><input id="pw-new" type="password" autocomplete="new-password"></label>
    <label class="field"><span>새 비밀번호 확인 / Nhập lại</span><input id="pw-new2" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')pwSave(${forced})"></label>
    <div id="pw-err" style="color:var(--bad);min-height:1.2em"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">${forced ? '<button class="btn" onclick="sb.auth.signOut().then(()=>location.reload())">로그아웃</button>' : '<button class="btn" onclick="document.getElementById(\'pw\').remove()">닫기</button>'}<button class="btn pri" id="pw-go" onclick="pwSave(${forced})">변경</button></div>
    <p class="muted" style="margin-top:10px">바꾸면 다른 기기에 로그인된 이 계정은 자동으로 로그아웃됩니다.</p></div>`;
  $('pw-cur').focus();
}
async function pwSave(forced){
  const cur = $('pw-cur').value, nw = $('pw-new').value, nw2 = $('pw-new2').value, err = t => { $('pw-err').textContent = t; };
  if (!cur) return err('현재 비밀번호를 넣으세요.');
  if (nw.length < 8) return err('새 비밀번호는 8자 이상이어야 합니다.');
  if (nw !== nw2) return err('새 비밀번호 두 칸이 다릅니다.');
  if (nw === cur) return err('지금과 다른 비밀번호를 쓰세요.');
  $('pw-go').disabled = true; err('');
  try {
    const a = await sb.auth.signInWithPassword({email: ME.email, password: cur});
    if (a.error) return err(forced ? '임시 비밀번호가 틀립니다.' : '현재 비밀번호가 틀립니다.');
    const u = await sb.auth.updateUser({password: nw});
    if (u.error) return err('변경 실패: ' + u.error.message);
    await sb.rpc('pw_changed');
    try { await sb.auth.signOut({scope: 'others'}); } catch (e) {}
    $('pw').remove(); alert('비밀번호를 바꿨습니다. / Đã đổi mật khẩu.');
    if (forced) boot();
  } finally { const b = $('pw-go'); if (b) b.disabled = false; }
}
// 관리자: 다른 계정 비밀번호를 임시 비밀번호로 초기화 (서버가 만들고 한 번만 보여줌)
async function pwUsersCard(){
  const r = await sb.from('app_users').select('email,name,role,must_change_pw').order('email');
  const el = $('pw-users'); if (!el) return;
  const list = (r.data || []).filter(u => u.role !== 'system');
  el.innerHTML = `<table><thead><tr><th>계정</th><th>이름</th><th>권한</th><th>상태</th><th></th></tr></thead><tbody>${list.map(u => `<tr><td>${E(u.email)}</td><td>${E(u.name || '')}</td><td>${E(u.role)}</td><td>${u.role === 'floor' ? '<span class="muted">현장 공용 · 관리자만 변경</span>' : u.must_change_pw ? '<span style="color:var(--warn,#b7791f)">초기화됨 · 변경 대기</span>' : ''}</td>
    <td>${u.email.toLowerCase() === ME.email.toLowerCase() ? '<button class="btn" style="padding:4px 10px" onclick="pwChange(false)">🔑 내 비밀번호 변경</button>' : `<button class="btn" style="padding:4px 10px" onclick="pwReset('${E(u.email)}')">비밀번호 초기화</button>`}</td></tr>`).join('')}</tbody></table>
    <p class="muted" style="margin-top:8px">초기화하면 임시 비밀번호가 한 번만 표시됩니다. 작업자에게 직접 전달하세요. 관리자·조회 계정은 다음 로그인 때 새 비밀번호로 바꿔야 합니다. <b>현장 공용(floor) 계정</b>은 태블릿에서 바꿀 수 없고, 초기화하면 그 계정을 쓰는 태블릿이 모두 로그아웃되니 임시 비밀번호를 각 태블릿에 다시 입력하세요(근무 시간 외에 하세요). 기록은 수정 이력(audit_log)에 남습니다.<br>백업 전용 계정은 여기 나오지 않습니다. 법인장 계정 비밀번호를 잊으면 Supabase 관리 화면 Users에서 iskim 계정에 재설정 메일을 보내세요.</p>`;
}
async function pwReset(email){
  const why = prompt(`${email} 비밀번호를 초기화합니다.\n사유 (예: 비밀번호 분실)`, '비밀번호 분실'); if (why === null) return;
  const r = await sb.rpc('admin_reset_password', {target_email: email, reason: why});
  if (r.error) { alert('초기화 실패: ' + r.error.message); return; }
  const ov = document.createElement('div'); ov.className = 'ov'; document.body.appendChild(ov);
  ov.innerHTML = `<div class="box" style="max-width:420px;text-align:center"><h2>임시 비밀번호</h2><p class="muted">${E(email)}</p>
    <div style="font:700 30px/1.4 monospace;letter-spacing:3px;margin:12px 0;user-select:all">${E(r.data)}</div>
    <p class="muted">이 창을 닫으면 다시 볼 수 없습니다. 작업자에게 직접 전달하세요.</p>
    <button class="btn pri" onclick="this.closest('.ov').remove();pwUsersCard()">닫기</button></div>`;
}
async function logout(){ if (!ME.email || !confirm(`${ME.email}에서 로그아웃할까요?`)) return; await sb.auth.signOut(); location.reload(); }

// ── 화면 전환
const VIEWS = [['floor','📝 실적 입력'],['machine','⚙️ 설비'],['tv','📺 현황판'],['ncr','🚫 부적합'],['report','📊 보고서'],['admin','🛠 기준정보']];
function go(v){ location.hash = v; }
window.addEventListener('hashchange', () => render());
function render(){
  if (ME.mustPw) return;
  const v = (location.hash || '').slice(1) || (ME.role === 'viewer' ? 'tv' : 'floor');
  S.view = v; document.body.classList.toggle('tv', v === 'tv');
  $('nav').innerHTML = VIEWS.filter(([k]) => ME.role === 'viewer' ? ['tv','report','ncr'].includes(k) : k !== 'admin' || ME.role === 'admin').map(([k,l]) => `<a href="#${k}" class="${k === v ? 'on' : ''}">${l}</a>`).join('');
  const app = $('app');
  if (v === 'floor') app.innerHTML = floorView(); else if (v === 'machine') app.innerHTML = machineView(); else if (v === 'tv') app.innerHTML = tvView();
  else if (v === 'report') { app.innerHTML = reportView(); loadReport().catch(e => { const el = $('rp-body'); if (el) el.innerHTML = '<p style="color:var(--bad)">불러오기 실패: ' + E(e.message || e) + '</p>'; }); } else if (v === 'admin') { app.innerHTML = adminView(); if (ME.role === 'admin') pwUsersCard(); }
  else if (v === 'ncr') { app.innerHTML = ncrView(); ncrLoad().catch(e => { const el = $('nc-body'); if (el) el.innerHTML = '<p style="color:var(--bad)">불러오기 실패: ' + E(e.message || e) + '</p>'; }); }
  if (v === 'floor') setTimeout(() => { const i = $('scan'); if (i && !document.querySelector('.ov')) i.focus(); }, 50);
}

// ════════ 📝 실적 입력 (태블릿) ════════
function floorView(){
  const procs = M.proc.filter(p => p.active !== false), workers = M.work.filter(w => w.active !== false);
  if (!S.worker || !S.proc) {
    return `<div class="card" style="margin-bottom:12px"><h2>① 작업자 <span class="vi">Công nhân</span></h2>${workers.length ? `<div class="pick">${workers.map(w => `<button class="${S.worker === w.code ? 'on' : ''}" onclick="S.worker='${E(w.code)}';LS.set('mes_worker',S.worker);render()">${E(w.name)}<span class="vi">${E(w.team||w.code)}</span></button>`).join('')}</div>` : '<p class="muted">등록된 작업자가 없습니다. 🛠 기준정보에서 추가하세요.</p>'}</div>
      <div class="card"><h2>② 공정 <span class="vi">Công đoạn</span></h2>${procGroups().map(g => `<div style="margin:6px 0 4px;font-weight:700;color:var(--sub)">${E(g.title)}</div><div class="pick" style="margin-bottom:8px">${g.procs.map(p => `<button class="${S.proc === p.code ? 'on' : ''}" onclick="S.proc='${E(p.code)}';LS.set('mes_proc',S.proc);render()">${p.seq && g.routed ? `<span class="muted" style="font-weight:400">${p.seq}</span> ` : ''}${E(p.name)}<span class="vi">${E(p.name_vi||'')}</span></button>`).join('')}</div>`).join('')}</div>`;
  }
  const t0 = today0().toISOString();
  const mine = M.rec.filter(r => r.process_code === S.proc && r.created_at >= t0);
  const running = M.rec.filter(r => r.status === 'running' && r.process_code === S.proc);
  const wos = activeWO().filter(w => routeOf(w).some(p => p.code === S.proc));
  const sel = woOf(S.wo);
  const curNote = sel ? (routeOf(sel).find(p => p.code === S.proc) || {}).note : '';
  const procSum = id => { const o = {}; M.rec.filter(r => r.wo_id === id && r.status === 'done').forEach(r => { o[r.process_code] = (o[r.process_code]||0) + (+r.good_qty||0); }); return o; };
  return `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
      <button class="btn" onclick="S.worker='';LS.del('mes_worker');render()">👷 ${E(workName(S.worker))} <span class="muted">바꾸기</span></button>
      <button class="btn" onclick="S.proc='';LS.del('mes_proc');render()">🔧 ${E(procName(S.proc))} <span class="muted">바꾸기</span></button>
      <input id="scan" placeholder="📷 작업지시·LOT 바코드 스캔 / Quét mã" onkeydown="if(event.key==='Enter'){scanWO(this.value);this.value=''}" style="flex:1;min-width:220px;padding:12px 14px;border:2px solid var(--brand);border-radius:10px;font-size:16px">
      ${'BarcodeDetector' in window ? '<button class="btn" onclick="camScan()">📷 카메라</button>' : ''}
    </div>
    ${running.length ? `<div class="card" style="margin-bottom:12px;border-color:#86EFAC;background:#F0FDF4"><h2>⏱ 진행 중 <span class="vi">Đang làm</span></h2>${running.map(r => `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #D1FAE5;flex-wrap:wrap">
        <div style="flex:1;min-width:200px"><b>${E(r.item_name||'')}</b> <span class="muted">${E(r.order_no||'')} · ${E(workName(r.worker_code))}${r.machine_code ? ' · ' + E(machName(r.machine_code)) : ''}</span><div class="muted">시작 ${hm(r.start_at)} · ${dur(Date.now() - new Date(r.start_at))} 경과${(p => p.n ? ` · <b style="color:var(--ok)">중간 저장 ${p.n}회 · 양품 ${N(p.g)}</b>` : '')(partOf(r.id))}</div></div>
        ${partOf(r.id).n ? '' : `<button class="btn" onclick="cancelRun(${r.id})" title="잘못 시작한 작업 취소">✕ 시작 취소</button>`}<button class="btn big" style="border-color:var(--ok);color:var(--ok)" onclick="finishDlg(${r.id}, true)" title="작업은 계속하고 지금까지 수량만 저장">📥 중간 저장<span class="vi">Lưu giữa ca</span></button><button class="btn ok big" onclick="finishDlg(${r.id})">■ 종료·실적 입력</button></div>`).join('')}</div>` : ''}
    <div class="grid" style="grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)">
      <div class="card"><h2>작업지시 <span class="vi">Lệnh sản xuất</span></h2>
        <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${wos.map(w => { const ps = procSum(w.wo_id), done = ps[S.proc] || 0, pct = w.plan_qty ? Math.min(100, done / w.plan_qty * 100) : 0;
          return `<button class="wo ${S.wo === w.wo_id ? 'on' : ''}" onclick="S.wo='${E(w.wo_id)}';render()"><div class="no">${E(w.order_no)} · ${E(w.lot||'')}</div><div class="nm">${E(w.name)}</div>
            <div class="muted">${E(procName(S.proc))} ${N(done)} / ${N(w.plan_qty)} ${E(w.unit||'')}</div><div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div></button>`; }).join('') + woOther(wos.length > 0)}</div></div>
      <div class="card">${sel ? `<h2>${E(sel.name)}</h2><div class="muted" style="margin-bottom:10px">${E(sel.order_no)} · LOT ${E(sel.lot||'-')} · 계획 ${N(sel.plan_qty)} ${E(sel.unit||'')}</div>
        ${curNote ? `<div style="background:#FFFBEB;border:1px solid #FDE68A;border-radius:9px;padding:8px 12px;margin-bottom:10px;font-size:14px"><b>📋 ${E(procName(S.proc))} 관리기준</b><br>${E(curNote)}</div>` : ''}
        ${c4Open(S.proc).map(c => `<div style="background:#FEF2F2;border:1px solid #FCA5A5;border-radius:9px;padding:8px 12px;margin-bottom:10px;font-size:14px"><b>🔁 4M 변경 적용 중 — 초품 검사 필요</b> <span class="vi">Thay đổi 4M — kiểm tra sản phẩm đầu</span><br>${E(C4K[c.kind])} · ${E(c.title)}${c.doc_no ? ' · ' + E(c.doc_no) : ''}</div>`).join('')}
        ${skillOn(S.proc) ? (k => `<div class="muted" style="margin-bottom:8px">🎓 ${E(workName(S.worker))} 자격: ${k && !k.expired ? `<b style="color:${SKL[k.level][3]}">${SKL[k.level][0]}</b>${k.valid_until ? ' (~' + E(k.valid_until) + ')' : ''}` : '<b style="color:var(--bad)">없음</b>'}</div>`)(skillOf(S.worker, S.proc)) : ''}
        <div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:12px"><button class="btn pri big" onclick="startJob()">▶ 작업 시작<span class="vi" style="color:#DCEBF5">Bắt đầu</span></button><button class="btn big" onclick="finishDlg(null)">＋ 실적만 입력<span class="vi">Nhập kết quả</span></button></div>
        <table><thead><tr><th>공정</th><th class="r">양품 누계</th><th class="r">불량</th></tr></thead><tbody>${routeOf(sel).map(p => { const rs = M.rec.filter(r => r.wo_id === sel.wo_id && r.process_code === p.code && r.status === 'done');
          return `<tr onclick="S.proc='${E(p.code)}';LS.set('mes_proc',S.proc);render();toast('🔧 ${E(p.name)} 공정으로 바꿨습니다')" title="눌러서 이 공정으로 바꾸기" style="cursor:pointer;${p.code === S.proc ? 'background:#E7F1F8;font-weight:700' : ''}"><td>${p._r ? `<span class="muted">${p.seq}</span> ` : ''}${E(p.name)}${p.is_final ? ' <span class="tag m-run">완성</span>' : ''}</td><td class="r">${N(rs.reduce((a,r) => a + (+r.good_qty||0), 0))}</td><td class="r" style="color:var(--bad)">${(v => v ? N(v) : '-')(rs.reduce((a,r) => a + (+r.ng_qty||0), 0))}</td></tr>`; }).join('')}</tbody></table>
        <div class="muted" style="margin-top:6px">공정 줄을 누르면 그 공정으로 바꿉니다. 누계는 오늘 이 기기가 받은 기록 기준입니다. 전체 누계는 📊 보고서에서 보세요.</div>`

function availability(code, fromMs, toMs){
  const evs = M.ev.filter(e => e.machine_code === code); let run = 0, unplanned = 0;
  evs.forEach(e => { const a = Math.max(fromMs, new Date(e.started_at).getTime()), b = Math.min(toMs, e.ended_at ? new Date(e.ended_at).getTime() : toMs); if (b <= a) return;
    const planned = e.state === 'stop' && (M.reasons.find(r => r.code === e.reason_code) || {}).planned; if (e.state === 'run') run += b - a; else if (!planned) unplanned += b - a; });
  return run + unplanned ? run / (run + unplanned) * 100 : null;
}
// 설비를 공정 순서대로 묶기: PCDU 공정 순서(BTP → TP) 순, 그다음 나머지 공정

  M.proc.slice().sort((a,b) => (a.seq||0) - (b.seq||0)).forEach(p => { if (!order.includes(p.code)) order.push(p.code); });
  const g = order.map(pc => ({pc, name: procName(pc), ms: ms.filter(m => m.process_code === pc).sort((a,b) => (a.seq||0) - (b.seq||0) || String(a.name).localeCompare(String(b.name), 'ko', {numeric: true}))})).filter(x => x.ms.length);

function erpPushBar(){

  return `<div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn pri" id="erp-push-btn" onclick="erpPush()">📤 미반영 완성 수량 ERP로 보내기</button>

}
function erpToken(){ try { return localStorage.getItem('_adm') || localStorage.getItem('_stf') || ''; } catch (e) { return ''; } }
async function erpPush(){
  const token = erpToken();
  if (!token) { alert('ERP 로그인 정보가 없습니다.\n이 브라우저에서 ERP(…/erp/) 화면에 먼저 로그인한 뒤 다시 누르세요.'); return; }
  const btn = $('erp-push-btn'); if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = '⏳ 확인 중…'; }
  try {
    const q = await sb.from('prod_records').select('*').eq('status','done').is('erp_sent_at', null).order('created_at').limit(20000);
    if (q.error) { alert('실적을 읽지 못했습니다: ' + q.error.message); return; }
    const g = {};
    (q.data || []).filter(x => x.wo_id && (+x.good_qty||0) > 0 && (woOf(x.wo_id) || {}).status !== '삭제됨' && isFinalFor(woOf(x.wo_id) || {code: x.item_code}, x.process_code))
      .forEach(x => { const o = g[x.wo_id] = g[x.wo_id] || {wo: woOf(x.wo_id), order_no: x.order_no, name: x.item_name, ids: [], qty: 0}; o.ids.push(x.id); o.qty += +x.good_qty || 0; });
    const list = Object.entries(g);
    if (!list.length) { toast('보낼 완성 수량이 없습니다.'); return; }
    if (!confirm('ERP 작업지시 생산 실적에 더합니다.\n\n' + list.map(([, o]) => `· ${o.order_no}  ${o.name}  +${N(o.qty)}`).join('\n') + '\n\n보낼까요? (ERP에서 같은 수량을 따로 입력하지 마세요)')) return;
    const ok = [], fail = [], unsure = [];
    for (const [wo_id, o] of list) {
      if (btn) btn.textContent = `⏳ ${o.order_no} 보내는 중…`;
      const ts = new Date().toISOString();
      const c = await sb.from('prod_records').update({erp_sent_at: ts}).in('id', o.ids).is('erp_sent_at', null).select('id,good_qty');
      if (c.error) { fail.push(`${o.order_no}: ${c.error.message}`); continue; }
      const got = c.data || [], qty = got.reduce((a, x) => a + (+x.good_qty||0), 0), ids = got.map(x => x.id);
      if (!qty) continue;   // 다른 기기가 먼저 보냄
      const undo = () => sb.from('prod_records').update({erp_sent_at: null}).in('id', ids);
      const res = await erpCall('updateWorkOrder', {id: wo_id, addProducedQty: qty, src: 'mes'}, token);
      if (res && res.ok) {
        if (o.wo && o.wo.lot) await erpCall('addWOOutputLot', {workOrderId: wo_id, orderNo: o.order_no, lot: o.wo.lot, qty, unit: o.wo.unit || 'Ea'}, token);
        ok.push(`${o.order_no} +${N(qty)}`);
      } else if (res && (res.error === 'timeout' || res.error === 'network')) {
        unsure.push(`${o.order_no} +${N(qty)}`);   // ERP에 들어갔을 수도 있어 표시는 그대로 둔다
      } else {
        await undo(); fail.push(`${o.order_no}: ${res && res.error || '알 수 없는 오류'}`);
        if (res && /인증|로그인/.test(res.error || '')) break;
      }
    }
    await syncWO(true);
    const done = list.map(([id]) => woOf(id)).filter(w => w && w.status !== '완료' && w.plan_qty > 0);
    let msg = (ok.length ? '✅ 보냄\n' + ok.join('\n') : '') + (unsure.length ? '\n\n⚠️ 응답 없음 (ERP 화면에서 실적이 들어갔는지 확인하세요)\n' + unsure.join('\n') : '') + (fail.length ? '\n\n❌ 실패 (다시 보낼 수 있음)\n' + fail.join('\n') : '');
    if (fail.some(f => /인증|로그인/.test(f))) msg += '\n\nERP 로그인이 만료됐습니다. ERP 화면에서 다시 로그인한 뒤 누르세요.';
    alert(msg.trim() || '보낼 수량이 없었습니다.');
    await erpOfferComplete(list.map(([id]) => id), token);
  } finally { if (btn) { btn.disabled = false; btn.textContent = '📤 미반영 완성 수량 ERP로 보내기'; } loadReport(); }
}
// 계획 수량을 채운 작업지시는 "완료"로 바꿀지 묻는다 (ERP 실적 입력 화면과 같은 동작)

  const out = [];
  for (let from = 0; ; from += 1000) {
    const r = await sb.from(t).select('*').order(ord, {ascending: true}).range(from, from + 999);
    if (r.error) throw r.error;
    out.push(...(r.data || [])); if ((r.data || []).length < 1000) break;
  }
  return out;
}
async function mesBackup(){

      let rows = [], err = '';

      const flat = rows.map(r => { const o = {}; for (const [k, v] of Object.entries(r)) { let x = v !== null && typeof v === 'object' ? JSON.stringify(v) : v; if (typeof x === 'string' && x.length > 32000) { x = x.slice(0, 32000) + '…(잘림)'; cut.push(t + '.' + k); } o[k] = x; } return o; });

      XLSX.utils.book_append_sheet(wb, ws, (ko + '_' + t).slice(0, 31));

    XLSX.utils.sheet_add_json(info, sum, {origin: 'A7'});

  } catch (e) { alert('백업 실패: ' + (e.message || e)); }

}

  return `<h2 style="margin-top:16px">🔬 특성검사 결과 <span class="muted">ERP 출하검사 첨부 파일에서 자동으로 읽음</span></h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">${[['검사', sns.size + '개'], ['OK', ok], ['NG', ng], ['재검사', retest], ['기간', ymd(t0) + ' ' + hm(t0) + ' ~ ' + ymd(t1) + ' ' + hm(t1)]].map(([l, v]) => `<div class="card" style="padding:8px 12px;margin:0"><div class="muted">${l}</div><div style="font-weight:800;${l === 'NG' && ng ? 'color:var(--bad)' : ''}">${v}</div></div>`).join('')}</div>
    <div style="overflow:auto"><table><thead><tr><th>항목</th><th class="r">개수</th><th class="r">최소</th><th class="r">최대</th><th class="r">평균</th><th class="r">표준편차</th></tr></thead><tbody>${st.map(x => `<tr><td><b>${E(x.k)}</b></td><td class="r">${x.n}</td><td class="r">${trFmt(x.min)}</td><td class="r">${trFmt(x.max)}</td><td class="r">${trFmt(x.avg)}</td><td class="r">${trFmt(x.sd)}</td></tr>`).join('')}</tbody></table></div>
    ${ng ? `<details style="margin-top:8px" open><summary style="cursor:pointer;font-weight:700;color:var(--bad)">NG ${ng}건</summary><table><thead><tr><th>시리얼</th><th>시각</th>${st.map(x => `<th class="r">${E(x.k)}</th>`).join('')}</tr></thead><tbody>${rows.filter(r => String(r.result || '').toUpperCase() !== 'OK').map(r => `<tr><td style="font-family:monospace">${E(r.sn)}</td><td>${E(ymd(r.end_time) + ' ' + hm(r.end_time))}</td>${st.map(x => `<td class="r">${trFmt(+(r.vals || {})[x.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></details>` : ''}
    <p class="muted">원본: ${files.map(E).join(', ') || '-'} · 단위는 특성검사기 파일 그대로입니다. 규격(상·하한)을 등록하면 공정능력(Cpk)도 계산할 수 있습니다.</p>`;
}
async function machBulk(){
  const cp = $('mb-code').value.trim().toUpperCase(), np = $('mb-name').value.trim(), pc = $('mb-proc').value, a = +$('mb-from').value || 1, n = Math.min(50, +$('mb-n').value || 0);
  if (!cp || !np || !n) { alert('코드 앞부분, 이름 앞부분, 대수를 넣어주세요.'); return; }
  const rows = []; for (let k = a; k < a + n; k++) { const code = `${cp}-${String(k).padStart(2, '0')}`; if (!M.mach.some(m => m.code === code)) rows.push({code, name: `${np} ${k}호기`, process_code: pc || null, active: true}); }
  if (!rows.length) { toast('모두 이미 있는 코드입니다.'); return; }
  if (!confirm(`${rows.length}대를 추가합니다.\n${rows.map(x => x.code + '  ' + x.name).join('\n')}`)) return;
  const r = await sb.from('machines').insert(rows); if (r.error) { alert('추가 실패: ' + r.error.message); return; }
  await loadMaster(); render(); toast(`＋ 설비 ${rows.length}대를 추가했습니다`);
}
async function adSave(i){
  const d = AD_DEF[AD.t], rid = i < 0 ? 'new' : 'r' + i, row = {};
  d.f.forEach(f => { const el = $(`ad-${rid}-${f[0]}`); row[f[0]] = f[2] === 'bool' ? el.checked : f[2] === 'number' ? (+el.value || 0) : (el.value.trim() || null); });
  if (!row.code || !row.name) { alert('코드와 이름을 넣어주세요.'); return; }
  const r = await sb.from(AD.t).upsert(row, {onConflict: 'code'});
  if (r.error) { alert('저장 실패: ' + r.error.message); return; }
  await loadMaster(); render(); toast('저장했습니다');
}

// ── 실시간: 다른 기기의 입력이 들어오면 화면을 다시 그린다
let _rt = null, _rtT = null;
function realtime(){
  if (_rt) return;
  _rt = sb.channel('mes-live').on('postgres_changes', {event: '*', schema: 'public', table: 'prod_records'}, () => liveRefresh())
    .on('postgres_changes', {event: '*', schema: 'public', table: 'machine_events'}, () => liveRefresh())
    .on('postgres_changes', {event: '*', schema: 'public', table: 'machine_checks'}, () => liveRefresh()).subscribe();
}
function liveRefresh(){ clearTimeout(_rtT); _rtT = setTimeout(async () => { await loadLive(); if (!document.querySelector('.ov') && S.view !== 'report' && S.view !== 'admin') render(); }, 400); }
setInterval(() => { if (sb && ME.role && (S.view === 'tv' || S.view === 'machine') && !document.querySelector('.ov')) render(); }, 30000);   // 경과 시간 표시 갱신
setInterval(() => { if (sb && ME.role && S.view === 'tv') loadLive().then(render); }, 5 * 60000);              // 실시간이 끊겨도 5분마다 새로

// ── 시작
async function boot(){
  if (!SB_URL || !SB_KEY || !window.supabase) { $('app').innerHTML = cfgView(); return; }
  if (!sb) sb = window.supabase.createClient(SB_URL, SB_KEY, {auth: {persistSession: true, autoRefreshToken: true}});
  const s = await sb.auth.getSession(), u = s.data && s.data.session && s.data.session.user;
  if (!u) { $('who').textContent = ''; $('app').innerHTML = loginView(); return; }
  ME.email = u.email;
  const r = await sb.from('app_users').select('role,name,must_change_pw').eq('email', u.email).maybeSingle();
  ME.role = r.data && r.data.role || ''; ME.name = r.data && r.data.name || u.email;
  if (!ME.role) { $('app').innerHTML = `<div class="card" style="max-width:520px;margin:30px auto"><h2>권한 없음</h2><p>${E(u.email)} 계정이 MES 사용자(app_users)에 등록되지 않았습니다. 관리자에게 요청하세요.</p><button class="btn" onclick="logout()">로그아웃</button></div>`; return; }
  $('who').textContent = `👤 ${r.data.name || u.email} · ${ME.role}`;
  $('pwc').style.display = ME.role === 'floor' ? 'none' : '';   // 현장 공용 계정은 태블릿에서 비밀번호 변경 불가 (관리자만 초기화)
  ME.mustPw = !!r.data.must_change_pw;
  if (r.data.must_change_pw) { $('app').innerHTML = '<div class="card" style="max-width:420px;margin:40px auto">새 비밀번호로 바꾼 뒤 사용할 수 있습니다.</div>'; if (!$('pw')) pwChange(true); return; }
  await loadMaster(); await loadLive(); setNet(true); realtime(); flushQ();
  if (ME.role !== 'viewer') { syncWO(true).then(render); woAutoSync(); }
  render();
}
boot();
</script>
