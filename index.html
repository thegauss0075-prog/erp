<!-- 작업지시서 발행 자재 선택 UI 프론트엔드 모듈 -->
<script>
// 글로벌 변수
let globalItemList = []; // 전체 품목/자재 DB
let selectedBomMaterials = []; // 선택된 제품의 BOM 기반 투입 필요 자재 목록

/**
 * 1. 완제품 선택 시 BOM을 해석하여 소요 자재만 필터링 후 모달 랜더링
 */
function onSelectFinishedProduct(productCode, targetProductionQty) {
  const product = globalItemList.find(i => i.code === productCode);
  if (!product) return;

  let bomList = [];
  try {
    // BOM 데이터 파싱 (예: [{"code":"M001","cat":"VN","unitQty":2.5}])
    bomList = typeof product.bom === 'string' ? JSON.parse(product.bom) : product.bom;
  } catch (e) {
    bomList = [];
  }

  // 소요량이 계산된 자재 리스트 생성
  selectedBomMaterials = bomList.map(b => {
    const matInfo = globalItemList.find(i => i.code === b.code && i.cat === b.cat) || {};
    const reqQty = Number(b.unitQty || 0) * Number(targetProductionQty || 0);
    return {
      code: b.code,
      cat: b.cat,
      name: matInfo.name || b.code,
      spec: matInfo.spec || '',
      unit: matInfo.unit || 'EA',
      stock: matInfo.stock || 0,
      reqQty: reqQty,
      selected: reqQty > 0 // ★ 핵심: 소요량이 0보다 큰 자재만 기본 선택(Checked) 처리!
    };
  });

  // UI 렌더링 호출
  renderMaterialSelectionTable();
}

/**
 * 2. 자재 선택 테이블 렌더링 (소요량 존재 자재 중심 필터링 & 이중 키 바인딩)
 */
function renderMaterialSelectionTable() {
  const container = document.getElementById("materialListContainer");
  if (!container) return;

  if (selectedBomMaterials.length === 0) {
    container.innerHTML = `<div class="p-4 text-center text-gray-500">등록된 BOM 자재 정보가 없습니다.</div>`;
    return;
  }

  let html = `
    <table class="w-full text-sm text-left border-collapse border border-gray-200">
      <thead class="bg-gray-100 font-semibold text-gray-700">
        <tr>
          <th class="p-2 border border-gray-200 text-center">선택</th>
          <th class="p-2 border border-gray-200">자재코드</th>
          <th class="p-2 border border-gray-200">자재명 / 규격</th>
          <th class="p-2 border border-gray-200 text-center">구분</th>
          <th class="p-2 border border-gray-200 text-right">현재재고</th>
          <th class="p-2 border border-gray-200 text-right">투입소요량</th>
        </tr>
      </thead>
      <tbody>
  `;

  // ★ 소요량이 등록된 BOM 자재만 정확하게 Loop
  selectedBomMaterials.forEach((mat, idx) => {
    const itemKey = mat.code + '_' + mat.cat; // 코드+카테고리 이중키
    const isChecked = mat.selected ? 'checked' : '';
    const rowBg = mat.selected ? 'bg-blue-50/50' : 'bg-white';

    html += `
      <tr class="border-b hover:bg-gray-50 ${rowBg}">
        <td class="p-2 border text-center">
          <input type="checkbox" 
                 id="chk_${itemKey}" 
                 data-key="${itemKey}" 
                 ${isChecked} 
                 onchange="toggleMaterialSelect('${mat.code}', '${mat.cat}', this.checked)"
                 class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
        </td>
        <td class="p-2 border font-mono font-medium text-gray-800">${mat.code}</td>
        <td class="p-2 border">
          <div class="font-medium">${mat.name}</div>
          <div class="text-xs text-gray-500">${mat.spec}</div>
        </td>
        <td class="p-2 border text-center"><span class="px-2 py-0.5 text-xs bg-gray-200 rounded">${mat.cat}</span></td>
        <td class="p-2 border text-right ${mat.stock < mat.reqQty ? 'text-red-600 font-bold' : ''}">${mat.stock.toLocaleString()} ${mat.unit}</td>
        <td class="p-2 border text-right">
          <input type="number" 
                 value="${mat.reqQty}" 
                 min="0"
                 onchange="updateMaterialQty('${mat.code}', '${mat.cat}', this.value)"
                 class="w-24 px-2 py-1 border rounded text-right font-bold focus:outline-none focus:ring-2 focus:ring-blue-500">
        </td>
      </tr>
    `;
  });

  html += `</tbody></table>`;
  container.innerHTML = html;
}

/**
 * 3. 체크박스 상태 변경 핸들러 (이중 키 적용)
 */
function toggleMaterialSelect(code, cat, isChecked) {
  const target = selectedBomMaterials.find(m => m.code === code && m.cat === cat);
  if (target) {
    target.selected = isChecked;
  }
  renderMaterialSelectionTable();
}

/**
 * 4. 수량 변경 핸들러 (수량 변경 시 자동 선택 활성화)
 */
function updateMaterialQty(code, cat, val) {
  const qty = Number(val) || 0;
  const target = selectedBomMaterials.find(m => m.code === code && m.cat === cat);
  if (target) {
    target.reqQty = qty;
    target.selected = qty > 0; // 수량이 0보다 크면 자동 체크
  }
}

/**
 * 5. 최종 작업지시서 및 선택 자재 일괄 발행 처리 (Server API 요청)
 */
async function submitWorkOrderWithMaterials() {
  const selectedMaterials = selectedBomMaterials.filter(m => m.selected && m.reqQty > 0);

  if (selectedMaterials.length === 0) {
    if (!confirm("투입 선택된 자재가 없습니다. 자재 차감 없이 작업지시서만 발행하시겠습니까?")) {
      return;
    }
  }

  const payload = {
    action: "addWorkOrder",
    pw: "staff", // 시스템 인증 비밀번호
    itemCode: document.getElementById("woItemCode").value,
    itemName: document.getElementById("woItemName").value,
    targetQty: Number(document.getElementById("woTargetQty").value),
    date: document.getElementById("woDate").value,
    note: document.getElementById("woNote").value
  };

  try {
    // 1단계: 작업지시서 등록
    const res = await fetch("YOUR_GAS_WEBAPP_URL", {
      method: "POST",
      body: JSON.stringify(payload)
    }).then(r => r.json());

    if (res.success && res.woNo) {
      // 2단계: 선택된 자재 차감 뱃치 등록
      if (selectedMaterials.length > 0) {
        await fetch("YOUR_GAS_WEBAPP_URL", {
          method: "POST",
          body: JSON.stringify({
            action: "addWOMaterialsBatch",
            pw: "staff",
            woNo: res.woNo,
            materials: selectedMaterials.map(m => ({
              code: m.code,
              cat: m.cat,
              qty: m.reqQty
            }))
          })
        });
      }
      alert("작업지시서(" + res.woNo + ") 및 자재 투입 처리가 성공적으로 등록되었습니다.");
      location.reload();
    } else {
      alert("오류 발생: " + res.message);
    }
  } catch (err) {
    alert("통신 중 오류가 발생했습니다: " + err.toString());
  }
}
</script>
